name: Betel Radar - primeira descoberta web

on:
  push:
    paths:
      - '.github/workflows/web-discovery-smoke.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar motor e parser
        working-directory: collector
        run: npm test

      - name: Executar descoberta via Brave Search
        env:
          BETEL_WEB_DISCOVERY_ENABLED: ${{ secrets.BETEL_WEB_DISCOVERY_ENABLED }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BETEL_DISCOVERY_UNAVAILABLE_AFTER_MISSES: ${{ secrets.BETEL_DISCOVERY_UNAVAILABLE_AFTER_MISSES }}
          BETEL_DISCOVERY_REMOVE_AFTER_HOURS: ${{ secrets.BETEL_DISCOVERY_REMOVE_AFTER_HOURS }}
        run: node collector/run-discovery.js
