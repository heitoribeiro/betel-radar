name: Betel Radar - validar coletor

on:
  push:
    paths:
      - 'collector/**'
      - 'v080.js'
      - 'v082-sync.js'
      - 'v082-real-data.js'
      - 'v082-map-data-bridge.js'
      - 'v082-opportunity-detail.js'
      - 'v082-admin-tools.js'
      - 'v082-data-correction.js'
      - 'v082-prospecting.js'
      - 'v082-detail-layout-fix.js'
      - 'v082-detail-data-guard.js'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/betel-sync.yml'
      - '.github/workflows/web-discovery.yml'
      - '.github/workflows/geocode-listings.yml'
      - '.github/workflows/collector-ci.yml'
  pull_request:
    paths:
      - 'collector/**'
      - 'v080.js'
      - 'v082-sync.js'
      - 'v082-real-data.js'
      - 'v082-map-data-bridge.js'
      - 'v082-opportunity-detail.js'
      - 'v082-admin-tools.js'
      - 'v082-data-correction.js'
      - 'v082-prospecting.js'
      - 'v082-detail-layout-fix.js'
      - 'v082-detail-data-guard.js'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/betel-sync.yml'
      - '.github/workflows/web-discovery.yml'
      - '.github/workflows/geocode-listings.yml'
      - '.github/workflows/collector-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes do motor de coleta
        working-directory: collector
        run: npm test

      - name: Validacao de sintaxe do backend e camada real
        run: |
          node --check collector/sync-engine.js
          node --check collector/supabase-rest.js
          node --check collector/run-sync.js
          node --check collector/run-discovery.js
          node --check collector/geocode-listings.js
          node --check collector/adapters/brave-search.js
          node --check v080.js
          node --check v082-sync.js
          node --check v082-real-data.js
          node --check v082-map-data-bridge.js
          node --check v082-opportunity-detail.js
          node --check v082-admin-tools.js
          node --check v082-data-correction.js
          node --check v082-prospecting.js
          node --check v082-detail-layout-fix.js
          node --check v082-detail-data-guard.js
