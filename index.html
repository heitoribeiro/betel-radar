<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Betel Radar</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#111;color:#fff}.box{text-align:center;padding:24px}.spin{width:42px;height:42px;border:4px solid #444;border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><div>Carregando Betel Radar…</div></div><script>(async()=>{try{let s='';for(const f of ['chunk00.txt','chunk01.txt','chunk02.txt','chunk03.txt'])s+=await(await fetch(f,{cache:'no-store'})).text();const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Falha ao carregar</h2><p>'+String(e)+'</p></div>'}})();</script></body></html>
