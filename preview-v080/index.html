<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Betel Radar v0.8.0 Preview</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#111;color:#fff}.box{text-align:center;padding:24px}.spin{width:42px;height:42px;border:4px solid #444;border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><div>Carregando prévia do Betel Radar v0.8.0…</div></div><script>(async()=>{try{let packed='';for(const f of ['../chunk00.txt','../chunk01.txt','../chunk02.txt','../chunk03.txt'])packed+=await(await fetch(f,{cache:'no-store'})).text();const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();html=html.replaceAll("window.location.origin+'/'","new URL('../',window.location.href).href").replace("navigator.serviceWorker.register('./service-worker.js')","navigator.serviceWorker.register('../service-worker.js')");document.open();document.write(html);document.close();const css=document.createElement('link');css.rel='stylesheet';css.href='./v080.css?v=8002';document.head.appendChild(css);const patch=document.createElement('script');patch.src='./v080.js?v=8002';document.body.appendChild(patch)}catch(e){document.body.innerHTML='<div class="box"><h2>Falha ao carregar a prévia</h2><p id="loadError"></p></div>';document.getElementById('loadError').textContent=String(e)}})();</script></body></html>
